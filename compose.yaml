services:
  web:
    build:
      context: .
      dockerfile: src/RequesterMini.Web/Dockerfile
    image: requestermini-web
    ports:
      - "8080:8080"
    environment:
      # Development turns on the detailed error page; drop it for a shared deployment.
      ASPNETCORE_ENVIRONMENT: Production
      DataDirectory: /data
    volumes:
      - requestermini-data:/data
    restart: unless-stopped

volumes:
  requestermini-data:
