name: CI

# The Release workflow only runs on a version tag, so before this existed a broken Dockerfile was
# first seen at release time — v0.3.0 had to be tagged twice because a new library was missing a
# COPY line. This builds the same image on every push, without pushing it anywhere.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
      - name: Test
        run: dotnet test RequesterMini.slnx -c Release

  container:
    name: Web container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Same context and Dockerfile as the release build, so a restore that skips a project fails
      # here instead. Nothing is pushed; the image is built and discarded.
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RequesterMini.Web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
