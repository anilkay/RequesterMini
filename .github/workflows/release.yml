name: Release

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to:
#   - run tests,
#   - publish the Avalonia desktop app as self-contained zips (win-x64, osx-arm64),
#   - build + push the web app container to GHCR,
#   - create a GitHub Release with the zips attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release and upload zips
  packages: write # needed to push the web image to GHCR

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REGISTRY: ghcr.io
  IMAGE_NAME: anilkay/requestermini-web

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test RequesterMini.slnx -c Release

  desktop:
    name: Desktop (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # csproj already sets PublishTrimmed + PublishSingleFile; SelfContained + RID come from here.
      - name: Publish Avalonia app
        run: >
          dotnet publish src/RequesterMini/RequesterMini.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o publish/${{ matrix.rid }}
          /p:Version="$VERSION"

      - name: Zip publish output
        run: |
          cd publish/${{ matrix.rid }}
          zip -r "../../RequesterMini-${{ env.VERSION }}-${{ matrix.rid }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: RequesterMini-${{ env.VERSION }}-${{ matrix.rid }}
          path: RequesterMini-${{ env.VERSION }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  docker:
    name: Web container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RequesterMini.Web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  release:
    name: GitHub Release
    needs: [desktop, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: RequesterMini-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RequesterMini-*.zip
          generate_release_notes: true
          body: |
            ## Web (container)

            ```sh
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ```

            ## Desktop (Avalonia, self-contained zips)

            - `RequesterMini-${{ env.VERSION }}-win-x64.zip` — Windows x64
            - `RequesterMini-${{ env.VERSION }}-osx-arm64.zip` — macOS Apple Silicon

            Unzip and run the `RequesterMini` executable.
